[project]
name = "ecommerce-es"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.138.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "jose>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "pyjwt[crypto]>=2.13.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (without external I/O)",
    "integration: integration tests (database, external services)",
    "smoke: sanity basic tests",
    "api: api integration tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "pytest-postgresql>=8.1.0",
    "faker>=40.27.0",
    "types-python-jose>=3.5.0.20260408",
]
